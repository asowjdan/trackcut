name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 개인정보·컴퓨터 정보 검사
        run: bash scripts/check-private.sh --all
      - name: FFmpeg 설치
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: 테스트
        run: cargo test --workspace
